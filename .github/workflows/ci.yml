name: Validate workflow toolkit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      go-version: '1.27.4'
  java-contract:
    name: Java workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13.1+2'
          cache-jdk: false
          overwrite-settings: false
      - name: Verify Java workflow contract
        shell: pwsh
        run: ./tests/java-contract.ps1
