name: Reusable Go verification

on:
  workflow_call:
    inputs:
      go-version:
        description: Exact Go release, 1.26.0 or later (for example, 1.27.4).
        type: string
        required: true
      runner:
        description: GitHub-hosted Ubuntu or Windows runner for the caller Go application.
        type: string
        default: ubuntu-24.04
    outputs:
      artifact-name:
        description: Name of the uploaded application artifact in the caller run.
        value: ${{ jobs.verify.outputs.artifact-name }}
      artifact-id:
        description: ID of the uploaded artifact.
        value: ${{ jobs.verify.outputs.artifact-id }}
      artifact-digest:
        description: SHA-256 of the uploaded archive.
        value: ${{ jobs.verify.outputs.artifact-digest }}
      cache-status:
        description: Dependency cache status (hit, miss, or disabled).
        value: ${{ jobs.verify.outputs.cache-status }}

permissions:
  contents: read

jobs:
  inputs:
    name: Validate Go inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.inputs.outputs.runner }}
      artifact-name: ${{ steps.inputs.outputs.artifact-name }}
      executable: ${{ steps.inputs.outputs.executable }}
    steps:
      - name: Validate Go version and runner
        id: inputs
        shell: pwsh
        env:
          REQUESTED_GO_VERSION: ${{ inputs.go-version }}
          REQUESTED_RUNNER: ${{ inputs.runner }}
        run: |
          if ($env:GITHUB_EVENT_NAME -cnotin @('push', 'pull_request', 'workflow_dispatch')) {
              throw 'Unsupported caller event. Use push, pull_request, or workflow_dispatch.'
          }
          if ($env:REQUESTED_GO_VERSION -cnotmatch '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$' -or
              [version]$env:REQUESTED_GO_VERSION -lt [version]'1.26.0') {
              throw 'go-version must be an exact Go release of 1.26.0 or later.'
          }
          switch -CaseSensitive ($env:REQUESTED_RUNNER) {
              'ubuntu-24.04' { $artifact = 'go-linux-amd64'; $executable = 'app' }
              'windows-2025' { $artifact = 'go-windows-amd64'; $executable = 'app.exe' }
              default { throw 'runner must be ubuntu-24.04 or windows-2025.' }
          }
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { $artifact += "-attempt-$env:GITHUB_RUN_ATTEMPT" }
          @(
              "runner=$env:REQUESTED_RUNNER"
              "artifact-name=$artifact"
              "executable=$executable"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

  verify:
    name: Verify and build the caller Go application
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-id != '' && needs.inputs.outputs.artifact-name || '' }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      cache-status: ${{ steps.cache.outputs.enabled != 'true' && 'disabled' || (steps.go.outputs.cache-hit == 'true' && 'hit' || 'miss') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Go dependency cache policy
        id: cache
        shell: pwsh
        env:
          CACHE_ENABLED: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('go.sum') != '' }}
        run: 'Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "enabled=$env:CACHE_ENABLED" -Encoding utf8'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ steps.cache.outputs.enabled == 'true' }}
          cache-dependency-path: go.sum
      - name: Check caller Go configuration
        shell: pwsh
        run: >-
          if (-not (Test-Path -LiteralPath 'go.mod' -PathType Leaf)) {
              throw 'Required caller root go.mod is missing.'
          }
      - name: Scan caller Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact=100 --no-banner .
      - name: Scan caller Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Vet, test, and build the caller application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'go.mod' -PathType Leaf)) {
              throw 'Required caller root go.mod is missing.'
          }
          $package = & go list -mod=readonly -buildvcs=false -f '{{.Name}}' .
          if ($LASTEXITCODE -ne 0) { throw 'go list failed.' }
          if ($package -cne 'main') { throw 'The caller root Go package must be main.' }

          & go vet -mod=readonly -buildvcs=false ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed.' }
          & go test -mod=readonly -buildvcs=false -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed.' }

          $suffix = & go env GOEXE
          if ($LASTEXITCODE -ne 0) { throw 'go env GOEXE failed.' }
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'go-verification'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $binary = Join-Path $artifactDirectory "app$suffix"
          & go build -mod=readonly -buildvcs=false -trimpath -o $binary .
          if ($LASTEXITCODE -ne 0) { throw 'go build failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: ${{ success() }}
        with:
          name: ${{ needs.inputs.outputs.artifact-name }}
          path: ${{ runner.temp }}/go-verification/${{ needs.inputs.outputs.executable }}
          if-no-files-found: error
          retention-days: 7
